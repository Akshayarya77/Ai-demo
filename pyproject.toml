
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-langchain-app"
version = "0.1.0"
description = "Gemini Flash application using LangChain and Streamlit"
requires-python = ">=3.10"
dependencies = [
    "google-api-core>=2.19,<3",
    "google-genai>=1,<2",
    "langchain-google-genai>=2.1,<4",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
